<div *ngIf="!loading">
  <div class="content">
    <div class="page-heading" style="margin: 20px; margin-top: 25px">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto">
          <div class="row align-items-center">
            <div class="col-auto mb-2">
              <h2>Invoice Generator</h2>
            </div>
          </div>
        </div>

        <div class="container-fluid p-4">
          <div class="invoiceformwpr">
            <div class="card">
              <div class="row">
                <div class="row">
                  <!-- First Row -->
                  <div class="col-md-6">
                    <div class="form-feild">
                      <label for="FullInvoicenumber" class="form-label">Invoice Number   <span style="color: red;">*</span></label>
                      <input type="text" id="FullInvoicenumber" class="form-control ng-untouched ng-pristine ng-valid"
                        [(ngModel)]="invoiceNumber" [ngModelOptions]="{ standalone: true }"
                        placeholder="Enter Invoice Number">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-feild">
                      <label for="FullInvoicenumber" class="form-label">Account ID   <span style="color: red;">*</span></label>
                      <input disabled type="text" class="form-control disabled-input" id="accountNumber"
                        placeholder="Account Id" [ngModelOptions]="{ standalone: true }" [(ngModel)]="accountId" />
                    </div>
                  </div>
              
                  <!-- Second Row -->
                  <div class="col-md-6" style="margin-top: 15px;">
                    <div class="form-feild">
                      <label for="Yourcompanydetails" class="form-label">Your company details   <span style="color: red;">*</span></label>
                      <input id="Yourcompanydetails" class="form-control" [(ngModel)]="companyDetails"
                        [ngModelOptions]="{ standalone: true }" />
                    </div>
                  </div>
                </div>

            <div class="card">
              <div class="row">
                <div class="col-md-4">

                  <div class="form-feild">
                    <label for="Purchaseorder" class="form-label">Customer/Client Email   <span style="color: red;">*</span></label>
                    <input type="text" class="form-control" id="email" placeholder="Client@example.com"
                      [ngModelOptions]="{ standalone: true }" [(ngModel)]="email" />
                  </div>
                 
                </div>
                <div class="col-md-4">
                  <div class="form-feild">
                    <label for="Billto" class="form-label">Bill to   <span style="color: red;">*</span></label>
                    <input id="Billto" class="form-control" [(ngModel)]="billTo"
                      [ngModelOptions]="{ standalone: true }" />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-feild">
                    <label for="PurchaseOrderNumber" class="form-label">Customer/Client Purchase Order Number</label>
                    <input type="text" id="PurchaseOrderNumber" class="form-control ng-untouched ng-pristine ng-valid"
                      [(ngModel)]="purchaseOrder" [ngModelOptions]="{ standalone: true }"
                      placeholder="Client Purchase Order Number">
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-feild">
                    <label for="Currency" class="form-label">Currency   <span style="color: red;">*</span></label>
                    <select class="form-select" id="currency" [ngModelOptions]="{ standalone: true }"
                      [(ngModel)]="currency">
                      <option value="AED">AED</option>
                    </select>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-feild">
                    <label for="InvoiceDate" class="form-label">Invoice date   <span style="color: red;">*</span></label>
                    <input type="date" id="InvoiceDate" class="form-control" [(ngModel)]="invoiceDate"
                      [ngModelOptions]="{ standalone: true }" />
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-feild">
                    <label for="DueDate" class="form-label">Due date   <span style="color: red;">*</span></label>
                    <input type="date" id="DueDate" class="form-control" [(ngModel)]="dueDate"
                      [ngModelOptions]="{ standalone: true }" />
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="row">
                <div class="col-md-4">
                  <div class="form-feild">
                    <label for="salesPersonName" class="form-label">Sales Person Name   <span style="color: red;">*</span></label>
                    <input [ngModelOptions]="{ standalone: true }" [(ngModel)]="salesPersonName" class="form-control"
                      id="salesPersonName" type="text" placeholder="Sales Person Name" />
                  </div>
                </div>

                <div class="col-md-4">
                  <div class="form-feild">
                    <label for="SalesPersonNumber" class="form-label">Sales Person Number</label>
                    <input [ngModelOptions]="{ standalone: true }" [(ngModel)]="salesPersonMobile" class="form-control"
                      id="SalesPersonNumber" type="tel" placeholder="Enter Sales Person Number">
                  </div>
                </div>

                <div class="col-md-4">
                  <div class="form-feild">
                    <label for="salesPersonEmail" class="form-label">Sales Person Email   <span style="color: red;">*</span></label>
                    <input [ngModelOptions]="{ standalone: true }" [(ngModel)]="salesPersonEmail" class="form-control"
                      id="salesPersonEmail" type="email" placeholder="Sales Person Email" />
                  </div>
                </div>
              </div>
            </div>

            <div class="card bg-light">
              <div class="multipleitems">
                <!-- Iterate over items array -->
                <div class="item" *ngFor="let item of items; let i = index">
                  <div class="row align-items-end mb-4 gx-0">
                    <!-- Item Name -->
                    <div class="col-md-3">
                      <label for="Itemdescription{{ i }}" class="form-label"
                        >Item Name <span style="color: red;">*</span></label
                      >
                      <input
                        type="text"
                        id="Itemdescription{{ i }}"
                        [(ngModel)]="item.description"
                        name="description{{ i }}"
                        class="form-control"
                        (input)="updateItemAmount(item)"
                        placeholder="Item Name"
                      />
                    </div>
            
                    <!-- Quantity -->
                    <div class="col-md-2">
                      <label for="Quantity{{ i }}" class="form-label"
                        >Quantity <span style="color: red;">*</span></label
                      >
                      <input
                        type="number"
                        id="Quantity{{ i }}"
                        [(ngModel)]="item.quantity"
                        name="quantity{{ i }}"
                        class="form-control"
                        (input)="updateItemAmount(item)"
                        placeholder="Quantity"
                      />
                    </div>
            
                    <!-- Item Price -->
                    <div class="col-md-3">
                      <label for="Unitcost{{ i }}" class="form-label"
                        >Item Price <span style="color: red;">*</span></label
                      >
                      <input
                        type="number"
                        id="Unitcost{{ i }}"
                        [(ngModel)]="item.unitCost"
                        name="unitCost{{ i }}"
                        class="form-control"
                        (input)="updateItemAmount(item)"
                        placeholder="Item Price"
                      />
                    </div>
            
                    <!-- Amount and Remove button -->
                    <div class="col-md-4 d-flex align-items-center">
                      <div class="flex-fill">
                        <label for="Amount{{ i }}" class="form-label">Total Price <span style="color: red;">*</span></label>
                        <input type="text" id="Amount{{ i }}" [value]="item.amount | number: '1.2-2'" class="form-control" readonly placeholder="Total Price" />
                      </div>
                      <!-- Remove button shown only when more than one item exists and the item is not empty -->
                      <div *ngIf="!isItemEmpty(item)" class="ms-2">
                        <button class="btn btn-danger" style="padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 25px;" (click)="removeItem(i)">Remove</button>
                      </div>

                    </div>
                  </div>
                </div>
              </div>
            
              <!-- Add Item Button -->

          <!-- Add Item Button -->
<!-- Add Item Button -->
<!-- Add Item Button with Flexbox -->
<div class="add-item-button" style="display: flex; justify-content: center; align-items: center; height: 60px; margin-top: 20px;">
  <button
    class="additem"
    style="background: none; border: none; cursor: pointer;"
    (click)="addItem()"
    aria-label="Add Item"
  >
    <svg width="40" height="40" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="29.5" cy="29.5" r="29.5" fill="currentColor" />
      <line x1="29.5938" y1="17" x2="29.5938" y2="42" stroke="white" stroke-width="1.5" />
      <line x1="42" y1="29.5938" x2="17" y2="29.5937" stroke="white" stroke-width="1.5" />
    </svg>
  </button>
</div>

              <!-- Subtotal -->
              <div class="subtotalwpr">
                <table>
                  <tbody>
                    <tr>
                      <td>Subtotal</td>
                      <td>AED&nbsp;{{ subtotal | number: '1.2-2' }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            

            <div class="card">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-feild">
                    <label for="payment" class="form-label">Notes / payment terms   <span style="color: red;">*</span></label>
                    <textarea id="payment" placeholder="Payment is due within 15 days" class="form-control"
                      [(ngModel)]="Notes" [ngModelOptions]="{ standalone: true }"></textarea>
                      <!-- <button (click)="saveNotes()">Save Notes</button> -->

                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-feild">
                    <label for="Tax" class="form-label">Tax %</label>
                    <input type="number" id="Tax" class="form-control" [(ngModel)]="taxPercentage"
                      [ngModelOptions]="{ standalone: true }" placeholder="Enter tax percentage" />
                  </div>
                  <div class="form-feild">
                    <label for="Discount" class="form-label">Discount (AED)</label>
                    <input type="number" id="Discount" class="form-control" [(ngModel)]="discount"
                      [ngModelOptions]="{ standalone: true }" placeholder="Enter discount amount" />
                  </div>
                  <div class="form-feild">
                    <label for="Shippingfee" class="form-label">Shipping Fee (AED)</label>
                    <input type="number" id="Shippingfee" class="form-control" [(ngModel)]="shippingFee"
                      [ngModelOptions]="{ standalone: true }" placeholder="Enter shipping fee" />
                  </div>
                  <div class="table-responsive mt-3">
                    <table class="w-100">
                      <tbody>
                        <tr>
                          <td class="text-end">Total</td>
                          <td class="text-end">AED&nbsp;{{ total | number: '1.2-2' }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
            <div class="card">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-feild">
                    <label for="bankDetails" class="form-label">
                      Bank account details <span style="color: red;">*</span>
                    </label>
                    <textarea
                      id="bankDetails"
                      class="form-control"
                      [(ngModel)]="bankDetails"
                      [ngModelOptions]="{ standalone: true }"
                    ></textarea>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-feild">
                    <label for="termsAndConditions" class="form-label">
                      Terms & Conditions <span style="color: red;">*</span>
                    </label>
                    <textarea
                      id="termsAndConditions"
                      class="form-control"
                      [(ngModel)]="termsAndConditions"
                      [ngModelOptions]="{ standalone: true }"
                    ></textarea>
                  </div>
             
                </div>
              </div>
            </div>
            

            <div class="btnwpr">
              <a (click)="saveInvoiceDetail()" class="btn btn-success w-100">Generate Payment Link</a>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
