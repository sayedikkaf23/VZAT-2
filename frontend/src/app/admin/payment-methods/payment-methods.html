<div class="content">
  <div class="page-heading">
    <div class="row align-items-center justify-content-between">
      <div class="col-auto">
        <div class="row align-items-center">
          <div class="col-auto mb-2">
            <h2>{{ "Payment Methods" }}</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="table-responsive overflow-behaviour">
    <table class="table table-list-data table-hover">
      <thead class="bg-light">
        <tr>
          <th scope="col">{{ "Bank Transfer" }}</th>
          <th scope="col">{{ "Card Machine" }}</th>
          <th scope="col">{{ "Cash Deposit" }}</th>
          <th scope="col">{{ "Cash Over Counter" }}</th>
          <th scope="col">{{ "Cheque Deposit" }}</th>
          <th scope="col">{{ "Online Payment" }}</th>
          <th scope="col">{{ "PDC Cheque" }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let payMethod of paymentMethods; let i = index">
          <td>
            <div class="form-check form-switch form-switch-2">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="Status_id2"
                [(ngModel)]="payMethod.bankTransfer"
                (change)="
                  onPaymentMethodStatusChange(payMethod, 'bankTransfer')
                "
              />
            </div>
          </td>

          <td>
            <div class="form-check form-switch form-switch-2">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="Status_id2"
                [(ngModel)]="payMethod.cardMachine"
                (change)="onPaymentMethodStatusChange(payMethod, 'cardMachine')"
              />
            </div>
          </td>

          <td>
            <div class="form-check form-switch form-switch-2">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="Status_id2"
                [(ngModel)]="payMethod.cashDeposit"
                (change)="onPaymentMethodStatusChange(payMethod, 'cashDeposit')"
              />
            </div>
          </td>

          <td>
            <div class="form-check form-switch form-switch-2">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="Status_id2"
                [(ngModel)]="payMethod.cashOverCounter"
                (change)="
                  onPaymentMethodStatusChange(payMethod, 'cashOverCounter')
                "
              />
            </div>
          </td>
          <td>
            <div class="form-check form-switch form-switch-2">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="Status_id2"
                [(ngModel)]="payMethod.chequeDeposit"
                (change)="
                  onPaymentMethodStatusChange(payMethod, 'chequeDeposit')
                "
              />
            </div>
          </td>
          <td>
            <div class="form-check form-switch form-switch-2">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="Status_id2"
                [(ngModel)]="payMethod.onlinePayment"
                (change)="
                  onPaymentMethodStatusChange(payMethod, 'onlinePayment')
                "
              />
            </div>
          </td>
          <td>
            <div class="form-check form-switch form-switch-2">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="Status_id2"
                [(ngModel)]="payMethod.pcdCheque"
                (change)="onPaymentMethodStatusChange(payMethod, 'pcdCheque')"
              />
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="data-footer">
    <div class="row align-items-center justify-content-end">
      <div class="col-auto">
        <ul class="pagination cursor-pointer">
          <li class="page-item d-flex" *ngIf="page !***REMOVED*** 1">
            <a class="page-link" (click)="getPaymentMethods(page - 1)">
              <span aria-hidden="true"
                ><i class="fa-solid fa-chevron-left"></i></span
            ></a>
          </li>
          <li
            class="page-item d-flex"
            *ngFor="let index of total_pages"
            [class.active]="page ***REMOVED*** index"
          >
            <a
              *ngIf="
                index ***REMOVED*** 1 ||
                index ***REMOVED*** total_page ||
                index ***REMOVED*** page ||
                index ***REMOVED*** page - 1 ||
                index ***REMOVED*** page + 1
              "
              (click)="getPaymentMethods(index)"
              class="page-link"
              >{{ index }}</a
            >
            <a
              *ngIf="
                (index ***REMOVED*** 1 && page !***REMOVED*** 1 && page !***REMOVED*** 2 && page !***REMOVED*** 3) ||
                (index ***REMOVED*** total_page - 1 &&
                  page !***REMOVED*** total_page &&
                  page !***REMOVED*** total_page - 1 &&
                  page !***REMOVED*** total_page - 2)
              "
              class="page-link"
              >...</a
            >
          </li>
          <li
            class="page-item d-flex"
            *ngIf="page !***REMOVED*** total_page && paymentMethods.length !***REMOVED*** 0"
          >
            <a class="page-link" (click)="getPaymentMethods(page + 1)">
              <span aria-hidden="true"
                ><i class="fa-solid fa-chevron-right"></i></span
            ></a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
