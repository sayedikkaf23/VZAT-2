<div class="login-page">
  <div class="login-tag">
    BeYour<br />
    OwnBoss
  </div>
  <div class="login-content">
    <div class="logo">
      <a href="javascript:void(0)">
        <img src="assets/images/Logo-footer (1).png" alt="" class="d-block" />
      </a>
    </div>
    <h2>Sign In to Your <br />Account</h2>
    <p>
      Welcome Back! Sign in with your data that <br />you entered during
      registration.
    </p>
    <div class="login-label">
      <span>LOGIN WITH EMAIL</span>
    </div>
    <form #adminLogin="ngForm" (ngSubmit)="login(adminLogin)">
      <div class="form-field">
        <input
            style="width: 400px;"
            type="email"
            class="form-control"
            name="email"
            placeholder="Email address"
            [(ngModel)]="loginDetails.email" 
            #email="ngModel"
            required email
        />
        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger">
            <div *ngIf="email.errors?.['required']">Email is required.</div>
                Please enter a valid email.
        </div>
      </div>
      <div class="form-field">
        <input
        style="width: 400px;"
            type="password"
            class="form-control"
            name="password"
            placeholder="Password"
            [(ngModel)]="loginDetails.password"
            #password="ngModel"
            [pattern]="passwordPattern"
            required
        />
        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-danger">
            <div *ngIf="password.errors?.['required']" class="text-danger" >Password is required.</div>
            <div *ngIf="password.errors?.['pattern']" class="text-danger">
               
                Please enter Valid Password.
            </div>
        </div>
      </div>
      <div class="row align-items-center justify-content-between">
        <div class="col-auto">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="flexCheckDefault"
            />
            <label class="form-check-label" for="flexCheckDefault">
              Keep me logged in
            </label>
          </div>
        </div>
      </div>
      <button type="submit"  style="color: #FE294D;"  class="btn w-100 mt-3">
        LOGIN
      </button>
    </form>
  </div>

</div>
