<div class="payment-widget-container">
  <!-- Payment Details -->
  <div *ngIf="paymentDetails" class="payment-details-container">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow">
            <!-- Virtuzone Logo -->
            <div class="card-header bg-white text-center py-4">
              <img src="assets/images/main-logo.svg" alt="Virtuzone" class="logo mb-3" style="max-height: 60px; max-width: 200px;">
            </div>
            <div class="card-header bg-primary text-white text-center">
              <h4 class="mb-0">Secure Payment</h4>
            </div>
            <div class="card-body p-4">
              <!-- Payment Summary -->
              <div class="payment-summary mb-4">
               
                <div class="row">
                  <div class="col-6">
                    <strong>Amount:</strong>
                  </div>
                  <div class="col-6 text-end">
                    <h5 class="text-primary mb-0">AED 1</h5>
                  </div>
                </div>
              </div>

              <hr>

              <!-- AFS Payment Gateway Integration -->
              <div class="payment-gateway-section">
                <h6 class="mb-3">Choose Payment Method</h6>
                
                <!-- Real AFS Payment Widget (when AFS is available) -->
                <div *ngIf="isAfsPayment" class="afs-payment-container">
                  <!-- Loading indicator for AFS -->
                  <!-- <div *ngIf="isLoading" class="text-center p-3">
                    <div class="spinner-border spinner-border-sm text-primary" role="status">
                      <span class="visually-hidden">Loading payment form...</span>
                    </div>
                    <p class="mt-2 mb-0">Loading secure payment form...</p>
                  </div> -->
                  
                  <!-- AFS Payment Form - Always present when isAfsPayment is true -->
                  <div id="widgetHost"></div> <!-- Your actual injected card form -->
                  
                  <div *ngIf="!isLoading" class="text-center mt-3">
                    <small class="text-muted">
                      <i class="fas fa-info-circle me-1"></i>
                      Complete your payment using the secure form above
                    </small>
                  </div>
                </div>
                
                
           
              </div>

              <!-- Security Info -->
              <div class="security-info mt-4 text-center">
                <small class="text-muted">
                  <i class="fas fa-shield-alt me-1"></i>
                  Your payment is secured with 256-bit SSL encryption
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
